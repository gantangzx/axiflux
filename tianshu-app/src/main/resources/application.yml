server:
  port: 8080

spring:
  application:
    name: tianshu-app
  main:
    web-application-type: reactive
  # 413 fix: WebFlux 聚合 @RequestBody 时受 max-in-memory-size 限制（默认 256KB），
  # 粘贴/拖拽图片走 dataURL（base64 +33%），一张截图轻松超过 1MB。
  # 聊天端点 POST /api/v1/chat/stream 需要至少能吞下 5-8MB 的请求体。
  codec:
    max-in-memory-size: ${CODEC_MAX_IN_MEMORY_SIZE:10MB}
  # Default to the "local" profile for dev convenience (IDE Run main -> picks up
  # application-local.yml with your API keys). The file is gitignored; if it is
  # absent Spring silently skips it. Override in production via SPRING_PROFILES_ACTIVE.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # ─── External services are OPTIONAL ──────────────────────────────
  # The app boots with in-memory sessions + no-op memory out of the box.
  # Uncomment and configure the blocks below to enable persistence.

  # PostgreSQL (needed only for JPA sessions or vector.provider=pgvector)
  datasource:
     url: ${PG_URL:jdbc:postgresql://localhost:5432/tianshu}
     username: ${PG_USER:postgres}
     password: ${PG_PASSWORD:}
     driver-class-name: org.postgresql.Driver

  # Redis. Needed for redis sessions and distributed scheduler locks, and it also
  # switches the following per-instance state to shared state automatically (no extra
  # flag) so a multi-instance deployment behaves like one logical agent:
  #   - tool-result side store: ref://tool-result/<id> handles stay dereferenceable
  #     on any instance, otherwise a later turn loses the truncated content
  #   - read-only tool result cache: hit rate is no longer diluted ~N-fold by N nodes
  #   - sub-agent cancel: POST /subagents/tasks/{id}/cancel reaches the owning
  #     instance over pub/sub instead of answering 404 while the task keeps running
  # Every one of these degrades to local behaviour if Redis is unreachable.
  data:
     redis:
       host: ${REDIS_HOST:localhost}
       port: ${REDIS_PORT:6379}
       password: ${REDIS_PASSWORD:}

  # Flyway (PostgreSQL schema migrations; needs a datasource)
  flyway:
     enabled: true
     locations: classpath:db/migration
     baseline-on-migrate: true

  jpa:
     hibernate:
       ddl-auto: validate
     open-in-view: false
     properties:
       hibernate:
         jdbc:
           time_zone: Asia/Shanghai

# ─── Tianshu ───────────────────────────────────────────────────────
tianshu:
  # ── OBO bearer-token auth (Spring Security resource server) ──
  # Disabled by default: every request runs as a single full-access user.
  #
  # When enabled, EVERY non-public path requires a valid JWT: /api/v1/**,
  # /mcp and the /tianshu/ws upgrade alike. Only the token edge, console
  # static assets (/ , /assets/**) and liveness probes (/actuator/health,
  # /actuator/info) stay public. Browser WebSocket clients may pass the token
  # as ?token=... on the handshake URL (hoisted to Authorization server-side).
  #
  # Fail-fast: enabled=true together with the built-in dev secret refuses to
  # start — always set AUTH_SECRET to a strong unique value.
  #
  # Dev/self-serve mode (tokens minted by POST /api/v1/auth/token, HS256, key =
  # SHA-256 of secret): the self-serve edge is auto-DISABLED once auth is on;
  # set token-endpoint-enabled=true to keep it (HS256 dev deployments).
  #
  # require-explicit-scopes=true: a token without a scopes claim gets no
  # privileges (scope-gated tools fail closed) instead of the wildcard.
  #
  # Production (recommended): point the resource server at your IdP's JWKS
  # (issuer-uri/jwk-set-uri, asymmetric keys) and leave the self-serve edge off:
  #   spring.security.oauth2.resourceserver.jwt.issuer-uri: https://idp.example.com
  #   # True OBO exchange is RFC 8693 (Spring Authorization Server).
  auth:
    enabled: ${AUTH_ENABLED:false}
    secret: ${AUTH_SECRET:dev-insecure-secret-change-me}
    default-ttl-seconds: 3600
    # require-explicit-scopes: ${AUTH_REQUIRE_SCOPES:false}
    # token-endpoint-enabled: ${AUTH_TOKEN_ENDPOINT:false}
    # JWT claim names used when the token comes from a custom external IdP or
    # gateway. JIT creates/updates local user_account rows after signature
    # verification; set jit-provisioning=false to keep authentication read-only.
    # user-id-claim: ${AUTH_USER_ID_CLAIM:sub}
    # username-claim: ${AUTH_USERNAME_CLAIM:preferred_username}
    # email-claim: ${AUTH_EMAIL_CLAIM:email}
    # display-name-claim: ${AUTH_DISPLAY_NAME_CLAIM:name}
    # jit-provisioning: ${AUTH_JIT_PROVISIONING:true}
    # Platform user administration lives under /api/v1/admin/users and requires
    # the 'users:admin' scope (grant it via the roles endpoint or the wildcard).
    # Suspended accounts are refused with 403; granted roles are merged into
    # the caller's token scopes per request and recorded in audit_log.

  # Self-serve SaaS onboarding. A successful POST /auth/register creates the
  # account and provisions its personal organization in one transaction. When
  # trial-days > 0 the org is granted a free trial for that window (the org's
  # trial_ends_at is set and its subscription is recorded as 'trialing'); 0
  # starts the org on the plain free tier. Stripe/plan gating stays off until
  # 'enabled' is flipped and keys are provided.
  billing:
    trial-days: ${BILLING_TRIAL_DAYS:14}

    # ── Live Stripe收款 ──
    # Flip enabled=true and supply the keys below; until the secret-key is set
    # the console keeps serving its mock-preview sessions (no money moves).
    #
    # enabled: ${BILLING_ENABLED:false}
    # public-url: ${BILLING_PUBLIC_URL:}            # e.g. https://app.example.com
    # secret-key: ${STRIPE_SECRET_KEY:}             # sk_test_... / sk_live_...
    # publishable-key: ${STRIPE_PUBLISHABLE_KEY:}   # pk_test_... / pk_live_...
    # webhook-secret: ${BILLING_WEBHOOK_SECRET:}    # whsec_...
    #
    # # Plan tier -> Stripe recurring price id (used when starting Checkout).
    # tier-price:
    #   pro: ${STRIPE_PRICE_PRO:price_xxx}
    #   team: ${STRIPE_PRICE_TEAM:price_yyy}
    #
    # # Reverse map: Stripe price id -> tier (used by the webhook).
    # price-plan:
    #   ${STRIPE_PRICE_PRO:price_xxx}: pro
    #   ${STRIPE_PRICE_TEAM:price_yyy}: team

    # ── P1 配额限制（超额拦截）──
    # 仅在 enabled=true 且 quota.enabled=true 时生效；按 UTC 自然月计量，
    # 与 usage_record 的 period 口径一致。限额 0 表示该维度不限。
    # quota:
    #   enabled: ${BILLING_QUOTA_ENABLED:true}
    #   monthly-tokens:          # 套餐 -> 每月 token 上限（input+output）
    #     free: ${QUOTA_FREE_TOKENS:200000}
    #     pro:  ${QUOTA_PRO_TOKENS:5000000}
    #     team: ${QUOTA_TEAM_TOKENS:25000000}
    #   monthly-turns:           # 套餐 -> 每月消息(轮次)上限
    #     free: ${QUOTA_FREE_TURNS:200}
    #     pro: 0
    #     team: 0

  # Offline enterprise license. Disabled by default; self-hosted and custom IdP
  # deployments are unchanged until explicitly enabled. enforcement accepts
  # off|warn|enforce; warn records invalid/expired state but still serves traffic.
  # license:
  #   enabled: ${TIANSHU_LICENSE_ENABLED:false}
  #   path: ${TIANSHU_LICENSE_PATH:/etc/tianshu/license/license.lic}
  #   public-key-path: ${TIANSHU_LICENSE_PUBLIC_KEY_PATH:/etc/tianshu/license/public.pem}
  #   deployment-id: ${TIANSHU_DEPLOYMENT_ID:}
  #   enforcement: ${TIANSHU_LICENSE_ENFORCEMENT:enforce}
  #   grace-days: 7

  # Console/API HTTP surface. Security response headers are ON by default;
  # CORS is OFF by default because the console is served same-origin.
  web:
    headers:
      # enabled: true                # false disables all security headers
      # csp-report-only: ${CSP_REPORT_ONLY:false}   # rollout: report violations, don't block
      # content-security-policy: "..."              # blank disables the CSP header only
      # hsts-max-age-seconds: 31536000              # <=0 disables; only sent over HTTPS
      # hsts-include-subdomains: true
      # hsts-preload: false          # only enable once every subdomain is HTTPS-only
      # referrer-policy: no-referrer
      # frame-options: DENY          # blank disables (CSP frame-ancestors covers modern browsers)
      # permissions-policy: "geolocation=(), microphone=(), camera=()"
    cors:
      # Only needed when the frontend is served from a different origin.
      # '*' + allow-credentials=true is refused at startup (browsers reject it);
      # use allowed-origin-patterns for wildcard + credentials.
      enabled: ${CORS_ENABLED:false}
      # allowed-origins:
      #   - https://console.example.com
      # allowed-origin-patterns:
      #   - https://*.example.com
      # allow-credentials: false
      # max-age-seconds: 1800

  # At least one LLM provider key is required to actually answer chat.
  # Volcengine ARK Agent Plan is pre-wired below and supports both the
  # OpenAI-compatible (/api/plan/v3) and Anthropic-compatible (/api/plan)
  # protocols with a single ARK_API_KEY.
  # Override per provider with OPENAI_API_KEY / ANTHROPIC_API_KEY / DEEPSEEK_API_KEY.
  llm:
    routing:
      strategy: cost_optimized
      defaultProvider: ${TIANSHU_DEFAULT_PROVIDER:ark-claude-haiku}
      defaultModel: ${TIANSHU_DEFAULT_MODEL:claude-haiku-4-5-20251001}
      # Premium models for the advanced_models commercial gate. A Free caller
      # who explicitly forces one of these gets a 402; automatic routing is
      # never gated (it just picks an in-plan model). Matched case-insensitively
      # as exact ids or substrings. Override wholesale via env/YAML.
      premium-models:
        - opus
        - o3
        - o4
        - gpt-5
        - gemini-2.5-pro
        - deepseek-r1
      # Cost-aware routing: every priced provider here is a candidate for
      # cost_optimized. Unpriced providers (e.g. the ARK aliases below) only
      # route via capability or when forcedModel is set.
      costs:
        openai:
          input-per-1k: 0.00015
          cached-input-per-1k: 0.000075
          output-per-1k: 0.0006
        deepseek:
          input-per-1k: 0.0001
          cached-input-per-1k: 0.00001
          output-per-1k: 0.0002
    openai:
      # ARK Plan OpenAI-compatible endpoint (supports Responses / chat completions).
      # model=ark-code-latest uses ARK Auto mode: effect+speed dual-dimension routing.
      # Switching the target model takes 3-5 minutes to take effect.
      apiKey: ${OPENAI_API_KEY:${ARK_API_KEY:}}
      baseUrl: ${OPENAI_BASE_URL:https://ark.cn-beijing.volces.com/api/coding/v3}
      model: ${OPENAI_MODEL:ark-code-latest}
    anthropic:
      # ARK Plan Anthropic-compatible endpoint
      apiKey: ${ANTHROPIC_API_KEY:${ARK_API_KEY:}}
      # LangChain4j's Anthropic client appends "/messages" to baseUrl, and ARK's
      # Anthropic-compatible path is /api/plan/v1/messages, so baseUrl must include /v1.
      baseUrl: ${ANTHROPIC_BASE_URL:https://ark.cn-beijing.volces.com/api/coding/v3}
      model: ${ANTHROPIC_MODEL:ark-code-latest}
    deepseek:
      apiKey: ${DEEPSEEK_API_KEY:}
      model: deepseek-chat
      baseUrl: https://api.deepseek.com
    # ─── 火山引擎 ARK Agent Plan extra providers ─────────────────────
    # Add any OpenAI-compatible model/vendor WITHOUT code changes. Each entry
    # is registered as an LlmClient under its `name` and appears in
    # GET /api/v1/models and the console model selector. Routing matches by name.
    #
    # Verified ARK Agent Plan aliases (2026-08): the ARK gateway maps each
    # alias to a backend model server-side. claude-* names are plan aliases
    # routed to doubao-seed, NOT real Anthropic Claude:
    #   ark-code-latest            -> ARK Auto mode (effect+speed smart routing)
    #   claude-sonnet-4-5 / opus-4-1 -> doubao-seed-2-1-turbo (flagship)
    #   claude-haiku-4-5           -> doubao-seed-2-0-mini  (lightweight)
    #   claude-3-5-sonnet / 3-7-sonnet -> earlier doubao-seed checkpoints
    # Note: native ARK model ids (doubao-*/deepseek-*/kimi-*/glm-*) are
    # rejected with UnsupportedModel on the agent-plan endpoint; only these
    # aliases work. Set ARK_API_KEY (or OPENAI_API_KEY) to a valid key to use.
    extra-providers:
      - name: ark-code-latest
        base-url: https://ark.cn-beijing.volces.com/api/coding/v3
        api-key: ${ARK_API_KEY:${OPENAI_API_KEY:}}
        model: ark-code-latest
      - name: ark-claude-haiku
        base-url: https://ark.cn-beijing.volces.com/api/coding/v3
        api-key: ${ARK_API_KEY:${OPENAI_API_KEY:}}
        model: claude-haiku-4-5-20251001
      - name: ark-claude-sonnet
        base-url: https://ark.cn-beijing.volces.com/api/coding/v3
        api-key: ${ARK_API_KEY:${OPENAI_API_KEY:}}
        model: claude-sonnet-4-5-20250929
      - name: ark-claude-opus
        base-url: https://ark.cn-beijing.volces.com/api/coding/v3
        api-key: ${ARK_API_KEY:${OPENAI_API_KEY:}}
        model: claude-opus-4-1-20250805
      - name: ark-claude-3-5-sonnet
        base-url: https://ark.cn-beijing.volces.com/api/coding/v3
        api-key: ${ARK_API_KEY:${OPENAI_API_KEY:}}
        model: claude-3-5-sonnet
      - name: ark-claude-3-7-sonnet
        base-url: https://ark.cn-beijing.volces.com/api/coding/v3
        api-key: ${ARK_API_KEY:${OPENAI_API_KEY:}}
        model: claude-3-7-sonnet
    # More examples:
    #   - name: deepseek-direct
    #     base-url: https://api.deepseek.com
    #     api-key: ${DEEPSEEK_API_KEY:}
    #     model: deepseek-reasoner
    #   - name: local-vllm          # local servers may omit api-key
    #     base-url: http://localhost:8000/v1
    #     model: meta-llama/Llama-3-8b-Instruct

  # Session storage: redis | jpa | (unset -> in-memory fallback)
  session:
    provider: ${SESSION_PROVIDER:jpa}

  # Long-term memory: qdrant | pgvector | milvus | none
  # qdrant is the default but lazily connected; use "none" to fully disable.
  vector:
    provider: ${VECTOR_PROVIDER:none}
    url: ${QDRANT_URL:http://localhost:6333}
    apiKey: ${QDRANT_API_KEY:}
    collectionName: tianshu_memory
    dimension: 1536
    metric: cosine
    embedUrl: https://api.openai.com/v1/embeddings
    embedApiKey: ${OPENAI_API_KEY:}

  scheduler:
    enabled: true
    poolSize: 10

  agent:
    maxIterations: 25
    toolTimeoutSeconds: 30
    defaultSystemPrompt: "You are a helpful AI assistant."

  # ---- 多模态视觉：图片附件随消息发给模型（VisionClient 按 tianshu.vision.api-key 装配）----
  vision:
    apiKey: ${OPENAI_API_KEY:${ARK_API_KEY:}}
    baseUrl: ${OPENAI_BASE_URL:https://ark.cn-beijing.volces.com/api/coding/v3}
    model: ${VISION_MODEL:ark-code-latest}
    maxTokens: 1024

  # Tool security policy chain (always active; defaults are permissive):
  #   1. deployment gate  — policy-mode all | whitelist | blacklist
  #   2. risk-level gate  — WRITE/DESTRUCTIVE tools require human approval
  #   3. network egress   — http_client/web_fetch block loopback/private/metadata URLs (SSRF)
  # Risk levels: SAFE(calculator,date_time) READ(file_read,web_search,db) 
  # NETWORK(http_client,web_fetch) WRITE(file_write,email_send) DESTRUCTIVE(code_executor)
  tools:
    builtinsEnabled: true
    # policy-mode: whitelist        # production hardening: only list safe tools
    # policy-allowed: calculator,date_time,web_search,web_fetch,http_client,file_read
    # policy-blocked: code_executor,spawn_task
    allow-private-network: false   # dev escape hatch for internal URL access
    # file-allowed-roots: D:/workspace,/tmp/tianshu   # restricts file_read/file_write
    # egress-proxy: proxy.internal:3128   # route http_client/web_fetch via a forward/egress proxy
    # Budget auto-approval (flat properties, NOT nested): first N low-risk gated
    # calls per tool per session skip the human prompt, then escalate.
    # DESTRUCTIVE tools (code_executor, spawn_task) never auto-approve.
    # auto-approve-budget-enabled: true
    # auto-approve-budget-default: 3          # auto-approvals per tool per session
    # auto-approve-budget-risk-ceiling: WRITE  # SAFE|READ|NETWORK|WRITE
    # auto-approve-budgets:
    #   file_write: 5                          # per-tool overrides
    # Per-tenant filesystem workspaces (P2-3): when enabled, file_read/file_write/
    # file_edit/grep_search and code_executor are jailed to <root>/<userId>/ with
    # symlink-safe containment; cross-user and host paths are refused. Off by
    # default (single-tenant keeps using file-allowed-roots / cwd).
    # workspaces-enabled: true
    # workspaces-root: D:/tianshu-workspaces   # blank -> <working-dir>/workspaces
    # workspaces-combine-global-roots: false    # true = also expose file-allowed-roots to every tenant
    # code-executor-sandbox: docker             # pair tenant workspaces with the locked container

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  pattern:
    # Correlate every line of a request via the traceId MDC key (TraceIdWebFilter).
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
  level:
    com.gantang.tianshu: INFO
