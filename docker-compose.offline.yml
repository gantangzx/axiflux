# AxiFlux Agent 平台 —— 离线（无外网）部署编排
#
# 与 docker-compose.prod.yml 的区别：
#   1. 所有镜像必须事先 `docker load`（本文件禁止拉取远端镜像：pull_policy: never）
#   2. 镜像使用本地离线 tag，便于与分发包内 images/*.tar 对应
#   3. 应用以「本地 JDK 镜像 + 挂载 jar」方式运行，避免离线目标机安装 JDK
#
# 用法：
#   1) 导入镜像（在分发包目录）
#        docker load -i images/postgres-pgvector-16-offline.tar
#        docker load -i images/redis-7-offline.tar
#        docker load -i images/jdk25-offline.tar        # 若目标机无 JDK
#   2) 准备配置
#        cp env/axiflux.env.example env/axiflux.env   # 修改 PG_PASSWORD / AUTH_SECRET 等
#   3) 启动
#        docker compose -f docker-compose.offline.yml --env-file env/axiflux.env up -d
#   4) 验收
#        ./scripts/ops/verify-install.sh --url http://127.0.0.1:8080 --user Axiflux --password '<口令>'
#
# 注意：本编排仅供隔离网络内的单机部署；多实例/HA 请参考 docs/ha-deployment.md。

name: axiflux-offline

services:

  postgres:
    image: ${OFFLINE_PG_IMAGE:-Axiflux/postgres-pgvector:16-offline}
    pull_policy: never
    container_name: axiflux-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DB:-Axiflux}
      POSTGRES_USER: ${PG_USER:-Axiflux}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD 必须设置（离线部署无默认值）}
      # 向量扩展初始化由镜像内置 initdb 脚本完成；如镜像不含，见 docs/offline-install.md §3
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - axiflux-pg-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-Axiflux} -d ${PG_DB:-Axiflux}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [axiflux-net]
    # 生产环境不把数据库暴露到宿主机；如需运维访问，取消下面注释并限制来源
    # ports:
    #   - "127.0.0.1:5432:5432"

  redis:
    image: ${OFFLINE_REDIS_IMAGE:-Axiflux/redis:7-offline}
    pull_policy: never
    container_name: axiflux-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD 必须设置}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - ${REDIS_MAXMEMORY:-2gb}
      - --maxmemory-policy
      - noeviction
    volumes:
      - axiflux-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [axiflux-net]

  axiflux:
    image: ${OFFLINE_JDK_IMAGE:-Axiflux/jdk:25-offline}
    pull_policy: never
    container_name: axiflux-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    working_dir: /app
    command:
      - java
      - -XX:MaxRAMPercentage=70
      - -Dfile.encoding=UTF-8
      - -Duser.timezone=Asia/Shanghai
      - -jar
      - /app/axiflux-app-0.1.0-SNAPSHOT.jar
      - --spring.profiles.active=prod
    environment:
      SERVER_PORT: "8080"
      AXIFLUX_PUBLIC_URL: ${AXIFLUX_PUBLIC_URL:-http://localhost:8080}
      PG_URL: jdbc:postgresql://postgres:5432/${PG_DB:-Axiflux}
      PG_USER: ${PG_USER:-Axiflux}
      PG_PASSWORD: ${PG_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET 必须设置（多实例需一致）}
      SESSION_PROVIDER: ${SESSION_PROVIDER:-jpa}
      VECTOR_PROVIDER: ${VECTOR_PROVIDER:-pgvector}
      EMBED_API_KEY: ${EMBED_API_KEY:-}
      ARK_API_KEY: ${ARK_API_KEY:-}
      # 企业版（未购买请置 false；EE jar 未包含时保持 false）
      AXIFLUX_EE_ENABLED: ${AXIFLUX_EE_ENABLED:-false}
      AXIFLUX_EE_SAML_ENABLED: ${AXIFLUX_EE_SAML_ENABLED:-false}
      AXIFLUX_EE_SCIM_ENABLED: ${AXIFLUX_EE_SCIM_ENABLED:-false}
      AXIFLUX_EE_AUDIT_ENABLED: ${AXIFLUX_EE_AUDIT_ENABLED:-false}
    volumes:
      - ./axiflux-app-0.1.0-SNAPSHOT.jar:/app/axiflux-app-0.1.0-SNAPSHOT.jar:ro
      - ./axiflux-ee-core-0.1.0-SNAPSHOT.jar:/app/libs/axiflux-ee-core-0.1.0-SNAPSHOT.jar:ro
      - axiflux-data:/app/data
      - axiflux-logs:/app/logs
    ports:
      - "${SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "java -version >/dev/null 2>&1 && (curl -fsS http://127.0.0.1:8080/actuator/health/liveness || exit 1)"]
      interval: 20s
      timeout: 6s
      retries: 10
      start_period: 90s
    networks: [axiflux-net]

volumes:
  axiflux-pg-data:
  axiflux-redis-data:
  axiflux-data:
  axiflux-logs:

networks:
  axiflux-net:
    driver: bridge
