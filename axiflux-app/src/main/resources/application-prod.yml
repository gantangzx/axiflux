# ============================================================================
# Axiflux 生产环境配置 (profile = prod)
# 激活方式: SPRING_PROFILES_ACTIVE=prod
# 原则:
#   1. 所有密钥/口令只允许通过环境变量注入，严禁在此文件写明文
#   2. 默认最小权限：工具白名单、容器沙箱、SSRF 防护、出口代理、认证强制
#   3. 认证对接外部 IdP（OIDC/JWKS，非对称密钥），不自签令牌
#   4. 日志不含敏感信息，DEBUG 一律关闭
# ============================================================================

server:
  port: 8080
  # 建议在前置网关/反向代理（Nginx/ALB）层终结 TLS 并限制请求体大小

spring:
  application:
    name: axiflux-prod
  # 聊天端点图片 dataURL 请求体需 > 默认 256KB（base64 体积 +33%），否则会 413
  codec:
    max-in-memory-size: ${CODEC_MAX_IN_MEMORY_SIZE:10MB}

  # ---- PostgreSQL（会话持久化 / 审计 / pgvector） ----
  datasource:
    url: ${PG_URL:jdbc:postgresql://pg.prod.internal:5432/Axiflux}
    username: ${PG_USER:Axiflux}
    password: ${PG_PASSWORD}              # 必填，无默认值，未注入则启动失败
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30              # 按实例规格与并发量调整
      minimum-idle: 5
      connection-timeout: 10000
      max-lifetime: 1800000              # 30 分钟，略小于数据库侧 wait_timeout
      pool-name: AxifluxHikariPool

  # ---- Redis（会话 / ShedLock 分布式锁），生产建议启用 TLS ----
  data:
    redis:
      host: ${REDIS_HOST:redis.prod.internal}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 5
      # 若 Redis 启用 TLS，增加：
      # ssl:
      #   enabled: true

  # ---- Flyway：仅由迁移脚本管理表结构，应用不允许自动建表/改表 ----
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: false

  jpa:
    hibernate:
      ddl-auto: validate                 # 只校验不改表，表结构偏差直接启动失败
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai

  # ---- OAuth2 资源服务器 ----
  # 私有化【默认本地账号模式】：不配置外部 Issuer，SecurityConfig 回退到本地
  # HS256（AUTH_SECRET）校验 /api/v1/auth/login 签发的令牌，开箱即用。
  #
  # 对接外部 IdP 时，由运维【显式注入】 OIDC_ISSUER_URI（或 OIDC_JWKS_URI）：
  # Spring Boot 据此自动拉取 JWKS（RS256 等非对称密钥），SecurityConfig 优先
  # 使用该 Decoder，本地 HS256 自签令牌不再生效。标准 OIDC scope 以空格分隔的
  # scope claim 传递，已自动兼容。
  #
  # 注意：绝不能给 Issuer 设非空默认值——否则未对接 IdP 的私有化部署也会被强制
  # 按外部 OIDC 解码本地令牌（DNS 解析占位域名失败→登录后所有接口 500）。
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:}
          # 若 IdP 不支持 issuer 发现，可直接指定 JWKS 地址：
          # jwk-set-uri: ${OIDC_JWKS_URI:}

# ============================================================================
axiflux:

  # ---- 计费 / Stripe 收款（生产模式）----
  # 全部密钥走环境变量；price id 为【生产模式】真实 recurring 价格，与测试账户不同，
  # 必须由运维在 Stripe Live 模式创建后通过环境变量/覆盖文件注入，禁止写进本文件。
  billing:
    enabled: true
    public-url: ${AXIFLUX_PUBLIC_URL:}
    secret-key: ${STRIPE_SECRET_KEY:}        # sk_live_...
    publishable-key: ${STRIPE_PUBLISHABLE_KEY:}  # pk_live_...
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}    # Dashboard 生产端点的 whsec_
    trial-days: 14

    # tier -> price / price -> tier 的映射键不支持环境占位符，且 price id 本身
    # 不是密钥（会出现在 Checkout URL 与前端，Stripe 官方允许提交）。
    # 在 Live 模式创建 Pro/Team recurring 价格后，直接把真实 price id 填到下面，
    # 正反映射必须一致；或用外部覆盖文件经 SPRING_CONFIG_ADDITIONAL_LOCATION 注入。
    # tier-price:
    #   pro: price_live_pro
    #   team: price_live_team
    # price-plan:
    #   price_live_pro: pro
    #   price_live_team: team
    quota:
      enabled: true

  # ---- 认证 ----
  auth:
    enabled: true                        # 生产必须开启
    # 对接外部 IdP 后 secret 不参与验签（仅自服务签发端点用）。
    # 自服务签发端点 /api/v1/auth/token 在 auth 开启后默认关闭（404），
    # 令牌应由 IdP 签发；也可在网关层直接封禁该路径。
    # 真正的 OBO 令牌交换（RFC 8693）应由 IdP/Spring Authorization Server 承担。
    secret: ${AUTH_SECRET:}              # IdP 模式可空；若开启签发端点必须强随机值
    default-ttl-seconds: 1800            # 令牌有效期收紧到 30 分钟
    require-explicit-scopes: true        # 无 scopes claim 的令牌零权限（fail-closed）
    token-endpoint-enabled: false        # 显式关闭自服务签发端点（默认即关闭，双保险）

  # ---- LLM 大模型路由 ----
  llm:
    routing:
      strategy: cost_optimized
      defaultProvider: ${AXIFLUX_DEFAULT_PROVIDER:openai}
      defaultModel: ${AXIFLUX_DEFAULT_MODEL:ark-code-latest}
    openai:
      apiKey: ${OPENAI_API_KEY:${ARK_API_KEY:}}
      baseUrl: ${OPENAI_BASE_URL:https://ark.cn-beijing.volces.com/api/plan/v3}
      model: ${OPENAI_MODEL:ark-code-latest}
    anthropic:
      apiKey: ${ANTHROPIC_API_KEY:${ARK_API_KEY:}}
      baseUrl: ${ANTHROPIC_BASE_URL:https://ark.cn-beijing.volces.com/api/plan/v1}
      model: ${ANTHROPIC_MODEL:ark-code-latest}
    deepseek:
      apiKey: ${DEEPSEEK_API_KEY:}
      model: deepseek-chat
      baseUrl: https://api.deepseek.com
    # 多厂商可通过 extra-providers 纯配置接入，无需改代码

  # ---- 会话存储：生产必须持久化，禁止 inmemory ----
  session:
    provider: jpa                        # redis 亦可；jpa 便于审计与运维查询

  # ---- 长期记忆向量库 ----
  vector:
    provider: ${VECTOR_PROVIDER:qdrant}
    url: ${QDRANT_URL:https://qdrant.prod.internal:6333}
    apiKey: ${QDRANT_API_KEY}            # 生产 Qdrant 必须开启鉴权
    collectionName: AXIFLUX_memory
    dimension: 1536
    metric: cosine
    # pgvector + ARK 多模态向量化（2026-09-03 实测可用）：
    # provider: pgvector
    # dimension: 2048
    # embedUrl: https://ark.cn-beijing.volces.com/api/v3/embeddings/multimodal
    # embedModel: doubao-embedding-vision-251215
    # embedApiKey: ${ARK_API_KEY}
    # 注意：换 embedding 模型后维度可能变（本模型 2048 维）；已建的 memory_items 表
    # 需 DROP 后由应用自动重建，客户端对维度不匹配会显式报错并降级关键词检索。

  # ---- 定时任务 ----
  scheduler:
    enabled: true
    poolSize: 10
    lockProvider: redis                  # 多实例部署必须用分布式锁，防止重复执行

  # ---- Agent 运行参数 ----
  agent:
    maxIterations: 25                    # 硬上限，防止工具调用死循环
    toolTimeoutSeconds: 30               # 单工具 30s 超时
    spawnTimeoutSeconds: 180
    defaultSystemPrompt: "You are a helpful AI assistant."

  # ---- 工具安全策略（生产加固） ----
  tools:
    builtinsEnabled: true
    # 部署门禁：白名单模式，仅显式列出的工具可用
    policy-mode: whitelist
    policy-allowed: calculator,date_time,web_search,web_fetch,http_client,file_read
    # 明确拉黑的高风险工具（双保险，白名单未列出即已不可用）
    policy-blocked: code_executor,spawn_task
    allow-private-network: false         # 严禁 Agent 访问内网/回环/元数据地址（SSRF）

    # code_executor 即使被临时放开，也必须走容器隔离（宿主机需可用 Docker）
    code-executor-sandbox: docker
    docker-image: alpine:3.20
    docker-memory: 512m
    docker-cpus: 1.0
    # 容器以 --network=none --read-only 等加固参数运行（见 DockerCommandSandbox）

    # 文件读写限制在指定根目录内（含符号链接逃逸检查），多目录用逗号分隔
    file-allowed-roots: ${FILE_ALLOWED_ROOTS:/data/Axiflux/workspace}

    # 出口代理：http_client/web_fetch 全部经正向代理出网，
    # 在代理层做域名白名单/审计，是 DNS rebinding 的最终兜底
    egress-proxy: ${EGRESS_PROXY:egress-proxy.prod.internal:3128}

    # 部署级白名单（完全免审批工具，生产建议留空，一律走人工/预算审批）
    # auto-approve: ""

    # 预算式自动审批（扁平字段）：生产建议关闭；DESTRUCTIVE 级任何情况下都不自动批准
    auto-approve-budget-enabled: false
    auto-approve-budget-default: 0
    auto-approve-budget-risk-ceiling: READ  # 即使开启也只允许只读工具自动放行
    # auto-approve-budgets:
    #   file_read: 1

  # ---- 技能加载 ----
  skills:
    enabled: true
    rootDir: ${SKILLS_ROOT:/data/Axiflux/skills}
    timeoutSeconds: 300

  # ---- Web/SSE ----
  web:
    enabled: true
    sseHeartbeatSeconds: 20              # 保持 < 网关空闲超时（Nginx 默认 60s）

  # ---- 多模态 / TTS / 邮件：按需启用，密钥全部环境变量注入 ----
  vision:
    apiKey: ${OPENAI_API_KEY:}
    baseUrl: ${OPENAI_BASE_URL:https://ark.cn-beijing.volces.com/api/plan/v3}
    model: ${VISION_MODEL:gpt-4o}
    maxTokens: 1024
  tts:
    apiKey: ${TTS_API_KEY:}
    model: tts-1
    defaultVoice: alloy
    format: mp3
  email:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    from: ${SMTP_FROM:Axiflux@example.com}
    starttls: true

# ============================================================================
# 监控：端点最小暴露，health 细节需认证；prometheus 仅对监控网段开放
# （建议在网关层对 /actuator/** 做 IP 白名单或 Basic 认证）
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  prometheus:
    metrics:
      export:
        enabled: true

# ============================================================================
# 日志：INFO 级别，traceId 全链路；生产建议挂载文件并由日志采集器收集
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
  level:
    com.gantang.axiflux: INFO
    org.springframework.security: WARN
  # 如需落盘：
  # file:
  #   name: /var/log/Axiflux/axiflux.log
  # logback:
  #   rollingpolicy:
  #     max-file-size: 100MB
  #     max-history: 30

# ============================================================================
# 部署备注（Dockerfile 已支持 JAVA_OPTS 透传）：
#   docker run -e SPRING_PROFILES_ACTIVE=prod \
#     -e PG_PASSWORD=... -e REDIS_PASSWORD=... -e ARK_API_KEY=... \
#     -e AUTH_SECRET=... -e OIDC_ISSUER_URI=... \
#     -e JAVA_OPTS="-Xms1g -Xmx2g -XX:MaxRAMPercentage=75" \
#     -p 8080:8080 axiflux:latest
