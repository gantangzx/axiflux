# ============================================================================
# Axiflux 本地开发环境 (profile = local，默认 profile)
#
# 目标：开发者本机“开箱即用”。基础设施默认指向 localhost（可用仓库根的
#       docker-compose.yml 一键拉起 PostgreSQL + Redis）；所有密钥/口令只从
#       环境变量读取，本文件不含任何明文敏感信息，可以安全提交。
#
# 激活：无需设置（application.yml 默认 SPRING_PROFILES_ACTIVE=local）。
# 密钥：复制 env/env.local.bat.example -> env/env.local.bat 填写，启动脚本自动加载。
#
# 仅保留与基线 application.yml 不同、且本地开发需要的覆盖项。
# ============================================================================

spring:
  # PostgreSQL / Redis are OPTIONAL even in local dev: leave PG_URL / REDIS_HOST
  # unset to run with in-memory sessions and process-local state. Point them at
  # localhost (e.g. via docker-compose.yml) when you want persistence.
  datasource:
    url: ${PG_URL:}
    username: ${PG_USER:postgres}
    password: ${PG_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

axiflux:
  # 本地默认不开启鉴权：单用户、全权限，最省事。
  # 需要联调注册/登录/计费时，在 env 中设 AUTH_ENABLED=true 并提供 AUTH_SECRET。
  auth:
    enabled: ${AUTH_ENABLED:false}
    secret: ${AUTH_SECRET:}

  # Stripe【测试模式】计费：与 dev 共用同一测试账户。密钥全部来自 env.local.bat；
  # webhook 本地联调走 `stripe listen`（scripts\stripe-listen.bat）。
  # 想彻底关闭收款联调时设 BILLING_ENABLED=false。
  billing:
    enabled: ${BILLING_ENABLED:true}
    public-url: ${AXIFLUX_PUBLIC_URL:http://localhost:8080}
    secret-key: ${STRIPE_SECRET_KEY:}
    publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    trial-days: 14

    tier-price:
      pro: price_1UIPbdEflqQPvhmbl7v5TKZC
      team: price_1UIlYKEflqQPvhmbb0gGqZy9
    price-plan:
      price_1UIPbdEflqQPvhmbl7v5TKZC: pro
      price_1UIlYKEflqQPvhmbb0gGqZy9: team

    quota:
      enabled: true

  # 会话存储默认 auto：配了 PG_URL 走 JPA、配了 REDIS_HOST 走 Redis，
  # 都没配则用进程内内存（重启不保留）。可用 SESSION_PROVIDER 显式指定。
  session:
    provider: ${SESSION_PROVIDER:auto}

  # 长期记忆默认关闭（开箱即用）。本地 PG 已装 pgvector 扩展时，在 env 设
  # VECTOR_PROVIDER=pgvector 即可启用 ARK 多模态向量（2048 维）。
  vector:
    provider: ${VECTOR_PROVIDER:none}
    dimension: 2048
    metric: cosine
    embed-url: https://ark.cn-beijing.volces.com/api/v3/embeddings/multimodal
    embed-model: doubao-embedding-vision-251215
    embed-api-key: ${EMBED_API_KEY:${ARK_API_KEY:${OPENAI_API_KEY:}}}

  # 离线企业 License。默认关闭（自托管/自定义 IdP 部署行为不变）。
  # 本地控制台需要「License 管理」页可用时打开：enforcement=off 表示只展示
  # 状态、不做任何拦截；apply/revoke 要求 path 与 public-key-path 有配置
  # （本地可在 ./data/license 放自签文件自测，文件不存在时状态为 MISSING）。
  license:
    enabled: ${AXIFLUX_LICENSE_ENABLED:true}
    enforcement: ${AXIFLUX_LICENSE_ENFORCEMENT:off}
    path: ${AXIFLUX_LICENSE_PATH:./data/license/license.lic}
    public-key-path: ${AXIFLUX_LICENSE_PUBLIC_KEY_PATH:./data/license/public.pem}
    grace-days: 7

  tools:
    policy-mode: all
    allow-private-network: false
    auto-approve: "calculator,date_time"
    code-executor-sandbox: local

# local 为单机“开箱即用”：Redis 缺失时应用已降级为进程内状态（RedisAvailability），
# 故不让可选的 Redis 健康检查拉低 readiness，避免无本地 Redis 时 health 报 503。
management:
  health:
    redis:
      enabled: false

logging:
  level:
    com.gantang.axiflux: ${LOG_LEVEL:DEBUG}
