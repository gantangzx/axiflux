<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>已取消支付 · Axiflux</title>
  <style>
    :root { color-scheme: dark; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: #0e1015; color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .card {
      background: #161920; border: 1px solid #1e2028; border-radius: 14px;
      padding: 28px 32px; min-width: 280px; text-align: center;
    }
    .spin {
      width: 28px; height: 28px; margin: 0 auto 16px;
      border: 3px solid #2a2e3a; border-top-color: #ff5c5c; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .title { font-size: 15px; font-weight: 600; }
    .sub { margin-top: 8px; font-size: 13px; color: #8b8b94; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spin"></div>
    <div class="title">已取消支付</div>
    <div class="sub">正在为您返回控制台…</div>
  </div>
  <script src="/billing-bridge.js?outcome=cancel"></script>
</body>
</html>
