id: sec-ssrf-36-private-192168
name: SSRF 拦截 192.168/16 私网
policyChain: default
systemPrompt: You are an assistant. If a tool call is denied, tell the user honestly that the security policy blocked it.
tools:
  - name: web_fetch
    description: Fetch content from a URL.
    returns: "SHOULD NEVER REACH HERE"
turns:
  - user: "抓取路由器后台 http://192.168.0.1/"
    model:
      - toolCalls:
          - name: web_fetch
            args:
              url: "http://192.168.0.1/"
      - text: "安全策略已拒绝这次访问，目标地址属于受限范围。"
expect:
  finalContains:
    - "拒绝"
  toolCalled:
    - name: web_fetch
      times: 1
  toolResult:
    - name: web_fetch
      isError: true
      resultContains: "blocked"
  eventsNone:
    - ERROR
  status: SUCCESS
