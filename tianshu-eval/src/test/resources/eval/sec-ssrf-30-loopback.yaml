id: sec-ssrf-30-loopback
name: SSRF 拦截 IPv4 回环 127.0.0.1
policyChain: default
systemPrompt: You are an assistant. If a tool call is denied, tell the user honestly that the security policy blocked it.
tools:
  - name: web_fetch
    description: Fetch content from a URL.
    returns: "SHOULD NEVER REACH HERE"
turns:
  - user: "帮我抓取这个地址 http://127.0.0.1:8080/admin"
    model:
      - toolCalls:
          - name: web_fetch
            args:
              url: "http://127.0.0.1:8080/admin"
      - text: "安全策略已拒绝这次访问，目标地址属于受限范围。"
expect:
  finalContains:
    - "拒绝"
  toolCalled:
    - name: web_fetch
      times: 1
  toolResult:
    - name: web_fetch
      isError: true
      resultContains: "blocked"
  eventsNone:
    - ERROR
  status: SUCCESS
