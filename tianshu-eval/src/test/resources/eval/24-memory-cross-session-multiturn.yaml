id: 24-memory-cross-session-multiturn
name: 跨会话/时间跨度——多轮对话后仍能召回早期决定，忽略未立项信息
memories:
  - content: "2026 年 3 月用户决定：tianshu-agent 项目统一用 Java 25 编译，禁止再用 JDK 21 启动"
    summary: "决定：tianshu-agent 统一 Java 25"
    tags: ["decision", "java", "build"]
    importance: 9
  - content: "用户曾调研过 Kotlin 多平台方案，但最终没有立项"
    summary: "Kotlin 多平台：仅调研未立项"
    tags: ["research", "kotlin"]
    importance: 4
tools: []
turns:
  - user: "先帮我确认下今天有哪些定时任务。"
    model:
      - text: "目前没有待执行的定时任务。"
  - user: "顺便问下 Kotlin 那边怎么样了？"
    model:
      - text: "Kotlin 多平台只做过调研，没有立项。"
  - user: "tianshu-agent 项目规定用哪个 JDK 版本编译来着？"
    model:
      - text: "规定统一使用 Java 25 编译，不能再用 JDK 21 启动。"
expect:
  finalContains:
    - "Java 25"
  finalNotContains:
    - "Kotlin 多平台方案已采用"
  recall:
    - query: "tianshu-agent 项目编译使用的 JDK 版本"
      contains: ["Java 25"]
      notContains: ["Kotlin"]
  eventsNone:
    - ERROR
  status: SUCCESS
