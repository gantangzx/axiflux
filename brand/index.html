<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AxiFlux / Reaxon — Logo 草图预览</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 48px 24px;
    background: #06080f;
    font-family: 'Segoe UI', 'Microsoft YaHei', Arial, sans-serif;
    color: #e5e7eb;
  }
  h1 { font-size: 22px; font-weight: 600; text-align: center; letter-spacing: 2px; }
  p.sub { text-align: center; color: #8b8b94; margin-top: 6px; }
  .grid {
    display: flex; flex-wrap: wrap; gap: 28px;
    justify-content: center; margin-top: 36px;
  }
  .card {
    background: #0b1020;
    border: 1px solid #1e2028;
    border-radius: 14px;
    padding: 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
  }
  .card img { display: block; width: 640px; max-width: 92vw; height: auto; border-radius: 8px; }
  .cap { margin-top: 14px; text-align: center; color: #9ca3af; font-size: 14px; }
  .cap b { color: #e5e7eb; }
</style>
</head>
<body>
  <h1>AxiFlux · Reaxon — Logo 概念草图</h1>
  <p class="sub">AxiFlux = 平台品牌（公理之流） ｜ Reaxon = 内核代号（反应式神经轴突）</p>
  <div class="grid">
    <div class="card">
      <img src="axiflux-logo.svg" alt="AxiFlux logo">
      <div class="cap"><b>AxiFlux</b>　公理为基 · 万象如流</div>
    </div>
    <div class="card">
      <img src="reaxon-logo.svg" alt="Reaxon logo">
      <div class="cap"><b>Reaxon</b>　一念即达 · React · Reason</div>
    </div>
    <div class="card">
      <img src="axiflux-mark.svg" alt="AxiFlux app icon" style="width:300px">
      <div class="cap"><b>AxiFlux</b> App 图标 / favicon</div>
    </div>
    <div class="card">
      <img src="reaxon-mark.svg" alt="Reaxon app icon" style="width:300px">
      <div class="cap"><b>Reaxon</b> App 图标 / favicon</div>
    </div>
  </div>
</body>
</html>
