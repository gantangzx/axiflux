<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.55" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="mglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="mbg" cx="0.5" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#16234f"/>
      <stop offset="1" stop-color="#0B1020"/>
    </radialGradient>
  </defs>

  <!-- App 图标底板 -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#mbg)"/>

  <!-- 无限流环 -->
  <g filter="url(#mglow)" fill="none" stroke="url(#mag)" stroke-width="20"
     stroke-linecap="round" opacity="0.95">
    <path d="M256,262
             C208,216 168,234 168,262
             C168,290 208,308 256,262
             C304,216 344,234 344,262
             C344,290 304,308 256,262"/>
  </g>

  <!-- 字母 A -->
  <g filter="url(#mglow)" fill="none" stroke="url(#mag)" stroke-width="24"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M256,120 L150,356"/>
    <path d="M256,120 L362,356"/>
    <path d="M202,262 H310"/>
  </g>

  <!-- 公理光点 -->
  <circle cx="256" cy="262" r="13" fill="#F5B94B"/>
</svg>
