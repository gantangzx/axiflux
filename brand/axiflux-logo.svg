<svg width="640" height="400" viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.55" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="halo" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#13204A" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0B1020" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="400" fill="#0B1020"/>
  <circle cx="320" cy="160" r="190" fill="url(#halo)"/>

  <!-- 流动无限流环 (Flux) -->
  <g filter="url(#glow)" fill="none" stroke="url(#ag)" stroke-width="9"
     stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <path d="M320,168
             C277,128 242,144 242,168
             C242,192 277,208 320,168
             C363,128 398,144 398,168
             C398,192 363,208 320,168"/>
  </g>

  <!-- 字母 A（公理起点） -->
  <g filter="url(#glow)" fill="none" stroke="url(#ag)" stroke-width="11"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M320,56 L232,248"/>
    <path d="M320,56 L408,248"/>
    <path d="M273,172 L367,172"/>
  </g>

  <!-- 公理光点 -->
  <circle cx="320" cy="168" r="6.5" fill="#F5B94B"/>
  <circle cx="320" cy="168" r="11" fill="#F5B94B" opacity="0.25"/>

  <!-- 字标 -->
  <text x="320" y="332" text-anchor="middle" font-size="52" fill="#F4F4F5"
        style="font-family:'Space Grotesk','Segoe UI',Arial,sans-serif;letter-spacing:1px">Axi<tspan fill="#22D3EE">Flux</tspan></text>
  <text x="320" y="368" text-anchor="middle" font-size="17" fill="#8B8B94"
        style="font-family:'Microsoft YaHei','PingFang SC',Arial,sans-serif;letter-spacing:4px">公理为基 · 万象如流</text>
</svg>
