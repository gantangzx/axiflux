<svg width="640" height="400" viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="v1bg" cx="0.5" cy="0.4" r="0.65">
      <stop offset="0" stop-color="#0e2a33" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#0B1020" stop-opacity="0"/>
    </radialGradient>
    <filter id="v1pulse" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="640" height="400" fill="#0B1020"/>
  <circle cx="320" cy="170" r="180" fill="url(#v1bg)"/>

  <!-- 极简几何 R：统一线宽、圆角，斜腿即轴突 -->
  <g fill="none" stroke="#46E8E3" stroke-width="15"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M226,100 V264"/>
    <path d="M226,100 H292"/>
    <path d="M292,100 C338,100 360,124 360,154 C360,184 338,204 294,204 H226"/>
    <path d="M330,186 L384,264"/>
  </g>

  <!-- 唯一的脉冲点 -->
  <g filter="url(#v1pulse)">
    <circle cx="384" cy="264" r="11" fill="#FF5C5C"/>
  </g>
  <circle cx="384" cy="264" r="4" fill="#FFE8E8"/>

  <!-- 字标 -->
  <text x="320" y="332" text-anchor="middle" font-size="50" fill="#F4F4F5"
        style="font-family:'Space Grotesk','Segoe UI',Arial,sans-serif;letter-spacing:1px">Reaxon</text>
  <text x="320" y="366" text-anchor="middle" font-size="16" fill="#8B8B94"
        style="font-family:'Space Grotesk','Microsoft YaHei',Arial,sans-serif;letter-spacing:5px">一念即达 · React · Reason</text>
</svg>
