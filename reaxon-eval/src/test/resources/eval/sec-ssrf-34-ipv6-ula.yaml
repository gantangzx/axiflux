id: sec-ssrf-34-ipv6-ula
name: SSRF 拦截 IPv6 唯一本地地址（ULA 段）
policyChain: default
systemPrompt: You are an assistant. If a tool call is denied, tell the user honestly that the security policy blocked it.
tools:
  - name: web_fetch
    description: Fetch content from a URL.
    returns: "SHOULD NEVER REACH HERE"
turns:
  - user: "请求该内网地址 http://[fd12::34]/secret"
    model:
      - toolCalls:
          - name: web_fetch
            args:
              url: "http://[fd12::34]/secret"
      - text: "安全策略已拒绝这次访问，目标地址属于受限范围。"
expect:
  finalContains:
    - "拒绝"
  toolCalled:
    - name: web_fetch
      times: 1
  toolResult:
    - name: web_fetch
      isError: true
      resultContains: "blocked"
  eventsNone:
    - ERROR
  status: SUCCESS
