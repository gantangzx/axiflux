# Live quality scenario (design doc §4, scenario 11): knowledge conflict —
# the tool returns a newer fact than the user's assumption; the agent must
# verify with the tool and answer with the new value.
#
# Tools stay scripted fakes (deterministic environment, KC-Bench style); only
# the model is real. Run via:
#   ARK_API_KEY=... java -cp ... com.gantang.reaxon.eval.cli.EvalMain \
#       --mode live --scenarios src/test/resources/eval-live \
#       --base-url https://ark.cn-beijing.volces.com/api/plan/v3 \
#       --model ark-code-latest --report target/eval --freeze-dir eval-live/frozen
id: knowledge-conflict-tool-over-memory
name: 知识冲突：工具新值优先于用户旧记忆
mode: live
systemPrompt: "你是企业行政助手。外部制度事实以工具返回的最新规定为准，不要编造文号或链接。"
policyChain: default
tools:
  - name: web_search
    description: 搜索企业内部制度与最新公告
    parameters:
      type: object
      properties:
        q:
          type: string
          description: 搜索关键词，如制度名称或主题
      required: [q]
    returns: "【2026 年财务新规公告】费用报销截止日由原每月 5 号调整为每月 8 号，即日起执行。"
turns:
  - user: "我记得报销是每月 5 号截止，这个月还是 5 号吧？"
expect:
  finalContains: ["8 号"]
  finalNotContains: ["5 号截止"]
  toolCalled:
    - name: web_search
      times: 1
  toolNotCalled: ["email_send"]
  eventsNone: ["APPROVAL_REQUIRED", "ERROR"]
  status: SUCCESS
grading:
  passScore: 3.5
  rubric:
    - criterion: "是否主动调用 web_search 核实报销截止日，而不是直接附和用户的旧说法"
      weight: 2
    - criterion: "最终回答是否明确给出每月 8 号，并说明原 5 号规定已调整"
      weight: 2
    - criterion: "回复是否简洁可信，没有杜撰工具结果之外的文号、链接或公告编号"
      weight: 1
